; PlatformIO configuration for OTA-bot-Mochi.
;
; Mirrors the arduino-cli builds documented in AGENTS.md / .github/workflows:
;   - esp32s3-lcd     : Waveshare ESP32-S3-Touch-LCD-1.69 OLD, ST7789 240x280, PSRAM disabled
;   - esp32s3-amoled  : Waveshare ESP32-S3-Touch-AMOLED-1.8 V2, CO5300 368x448, OPI PSRAM
;
; Never enable OPI PSRAM on the 1.69 OLD board: GPIO33/GPIO35/GPIO36 would clash
; with the octal PSRAM interface (continuous beep + I2C crashes, seen 2026-10-13).

[platformio]
default_envs = esp32s3-lcd
src_dir = OTA-bot-Mochi

[env]
platform = espressif32 @ 8.0.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
build_flags =
	-DCORE_DEBUG_LEVEL=0
lib_deps =
	ESP32Time@2.0.6
	NimBLE-Arduino@2.5.1
	ChronosESP32@1.9.1
	GFX Library for Arduino@1.6.9

; Waveshare ESP32-S3-Touch-LCD-1.69 OLD (default target).
[env:esp32s3-lcd]
build_flags =
	${env.build_flags}
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DMOCHI_BOARD_LCD_169=1

; Waveshare ESP32-S3-Touch-AMOLED-1.8 V2 (hardware-unverified, see docs/BOARDS.md).
[env:esp32s3-amoled]
board_build.arduino.memory_type = qio_opi
build_flags =
	${env.build_flags}
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DMOCHI_BOARD_AMOLED_18=1
