name: Firmware and host checks

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

env:
  BOARD_FQBN: "esp32:esp32:esp32s3:CDCOnBoot=cdc,PSRAM=disabled,FlashSize=16M"

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Native regression tests
        run: bash scripts/test-host.sh
      - name: Release packaging tests
        run: python3 tests/release_package_test.py
      - name: Shared build pin tests
        run: python3 tests/build_versions_test.py

  firmware:
    needs: host
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load shared build pins
        run: python3 scripts/build-versions.py >> "$GITHUB_ENV"
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0
        with:
          version: ${{ env.ARDUINO_CLI_VERSION }}
      - name: Cache Arduino core and libraries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-${{ runner.os }}-${{ hashFiles('.github/workflows/checks.yml', 'versions.ini') }}
      - name: Install pinned ESP32 core
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install "esp32:esp32@${ESP32_CORE_VERSION}" --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Install pinned libraries
        run: |
          arduino-cli lib install "ESP32Time@${ESP32TIME_VERSION}" "NimBLE-Arduino@${NIMBLE_VERSION}"
          arduino-cli lib install --no-deps "ChronosESP32@${CHRONOS_VERSION}" "GFX Library for Arduino@${GFX_VERSION}"
      - name: Restore compiled object cache
        if: github.event_name != 'release' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ runner.temp }}/arduino-build
            ${{ runner.temp }}/arduino-build-amoled
          key: objects-${{ runner.os }}-${{ hashFiles('.github/workflows/checks.yml', 'versions.ini') }}-${{ hashFiles('OTA-bot-Mochi/**') }}
      - name: Compile, without connecting to a device
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli compile --jobs 4 --warnings all \
            --fqbn "$BOARD_FQBN" \
            --build-property "upload.maximum_size=6553600" \
            --build-property "compiler.cpp.extra_flags=-DMOCHI_BOARD_LCD_169" \
            --build-path "$RUNNER_TEMP/arduino-build" \
            --output-dir "$RUNNER_TEMP/firmware" \
            OTA-bot-Mochi
      - name: Compile the AMOLED board profile, without connecting to a device
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli compile --jobs 4 --warnings all \
            --fqbn "esp32:esp32:esp32s3:CDCOnBoot=cdc,PSRAM=opi,FlashSize=16M" \
            --build-property "upload.maximum_size=6553600" \
            --build-property "compiler.cpp.extra_flags=-DMOCHI_BOARD_AMOLED_18" \
            --build-path "$RUNNER_TEMP/arduino-build-amoled" \
            --output-dir "$RUNNER_TEMP/firmware-amoled" \
            OTA-bot-Mochi
      - name: Record build profile and checksums
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/firmware"
          {
            printf 'Commit: %s\n' "$GITHUB_SHA"
            printf 'Source ref: %s\n' "$GITHUB_REF"
            printf 'Build run: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'Arduino CLI: %s\n' "$ARDUINO_CLI_VERSION"
            printf 'ESP32 core: %s\n' "$ESP32_CORE_VERSION"
            printf 'FQBN: %s\n' "$BOARD_FQBN"
            printf 'Libraries: ESP32Time %s; NimBLE-Arduino %s; ChronosESP32 %s; GFX Library for Arduino %s\n' "$ESP32TIME_VERSION" "$NIMBLE_VERSION" "$CHRONOS_VERSION" "$GFX_VERSION"
            printf 'Reference board: Waveshare ESP32-S3-Touch-LCD-1.69 OLD\n'
            printf 'Profile: -DMOCHI_BOARD_LCD_169\n'
            printf 'Partitions: sketch partitions.csv, Mochi 16MB OTA layout v1, two 0x640000-byte app slots\n'
            printf 'Confirm the 16MB flash profile; PSRAM must stay disabled on the OLD board.\n'
          } > BUILD-INFO.txt
          sha256sum -- *.bin > SHA256SUMS.txt
          cd "$RUNNER_TEMP/firmware-amoled"
          {
            printf 'Commit: %s\n' "$GITHUB_SHA"
            printf 'Source ref: %s\n' "$GITHUB_REF"
            printf 'Build run: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'Arduino CLI: %s\n' "$ARDUINO_CLI_VERSION"
            printf 'ESP32 core: %s\n' "$ESP32_CORE_VERSION"
            printf 'Libraries: ESP32Time %s; NimBLE-Arduino %s; ChronosESP32 %s; GFX Library for Arduino %s\n' "$ESP32TIME_VERSION" "$NIMBLE_VERSION" "$CHRONOS_VERSION" "$GFX_VERSION"
            printf 'Profile: -DMOCHI_BOARD_AMOLED_18 (Waveshare ESP32-S3-Touch-AMOLED-1.8 V2)\n'
            printf 'Partitions: sketch partitions.csv, Mochi 16MB OTA layout v1, two 0x640000-byte app slots\n'
            printf 'FQBN: esp32:esp32:esp32s3:CDCOnBoot=cdc,PSRAM=opi,FlashSize=16M\n'
            printf 'The 8MB octal PSRAM holds the 368x448 frame canvas; see docs/BOARDS.md.\n'
          } > BUILD-INFO.txt
          sha256sum -- *.bin > SHA256SUMS.txt
          for directory in "$RUNNER_TEMP/firmware" "$RUNNER_TEMP/firmware-amoled"; do
            profile="$BOARD_FQBN"
            if [[ "$directory" == *firmware-amoled ]]; then
              profile="esp32:esp32:esp32s3:CDCOnBoot=cdc,PSRAM=opi,FlashSize=16M"
            fi
            {
              printf '\nResolved compiler and framework tools:\n'
              arduino-cli compile --fqbn "$profile" --show-properties "$GITHUB_WORKSPACE/OTA-bot-Mochi" | \
                grep -E '^(runtime.tools.*\.path|compiler\.(c|cpp)\.(cmd|flags)|build\.(partitions|flash_mode|flash_freq))='
              arduino-cli core list
              arduino-cli lib list
            } >> "$directory/BUILD-INFO.txt"
            (cd "$directory" && sha256sum --check SHA256SUMS.txt)
          done
      - name: Publish downloadable firmware artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mochi-esp32s3-${{ github.sha }}
          path: ${{ runner.temp }}/firmware/
          if-no-files-found: error
          retention-days: 14

      - name: Publish AMOLED profile artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mochi-esp32s3-amoled-${{ github.sha }}
          path: ${{ runner.temp }}/firmware-amoled/
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'release'
    needs: firmware
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download LCD firmware from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mochi-esp32s3-${{ github.sha }}
          path: ${{ runner.temp }}/release-lcd
      - name: Download AMOLED firmware from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mochi-esp32s3-amoled-${{ github.sha }}
          path: ${{ runner.temp }}/release-amoled
      - name: Prepare board-specific release assets
        run: |
          python3 scripts/package-release.py \
            --lcd "$RUNNER_TEMP/release-lcd" \
            --amoled "$RUNNER_TEMP/release-amoled" \
            --output "$RUNNER_TEMP/release-assets"
      - name: Attach binaries and checksums to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/release-assets/"* \
            --repo "$GH_REPO"
